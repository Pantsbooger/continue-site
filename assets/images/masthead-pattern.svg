<svg xmlns="http://www.w3.org/2000/svg" width="220" height="160" viewBox="0 0 220 160">
  <!-- Subtle wallpaper of the site's own genres, in the same hand-drawn
       line-art style as the card icons in assets/js/site.js (drawIcon).
       Dark grey on the masthead's near-black background, meant to read
       as texture, not artwork - tiled via CSS background-repeat. -->
  <g fill="none" stroke="#3a423c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">
    <!-- controller (games) -->
    <g transform="translate(20,28)">
      <rect x="-14" y="-6" width="28" height="14" rx="6"/>
      <circle cx="8" cy="-2" r="1.6" fill="#3a423c" stroke="none"/>
      <circle cx="11" cy="2" r="1.6" fill="#3a423c" stroke="none"/>
      <line x1="-9" y1="-3" x2="-9" y2="3"/>
      <line x1="-12" y1="0" x2="-6" y2="0"/>
    </g>
    <!-- mushroom (games) -->
    <g transform="translate(72,18) rotate(-4)">
      <path d="M-10,2 A10,8 0 0 1 10,2 Z" fill="#3a423c" stroke="none"/>
      <rect x="-4" y="2" width="8" height="9" rx="2"/>
      <circle cx="-4" cy="-2" r="1.2" fill="#1c231f" stroke="none"/>
      <circle cx="3" cy="-4" r="1" fill="#1c231f" stroke="none"/>
      <circle cx="1" cy="0" r="0.9" fill="#1c231f" stroke="none"/>
    </g>
    <!-- castle (tabletop) -->
    <g transform="translate(132,32)">
      <path d="M-14,10 L-14,-4 L-10,-4 L-10,-8 L-6,-8 L-6,-4 L-2,-4 L-2,-8 L2,-8 L2,-4 L6,-4 L6,-8 L10,-8 L10,-4 L14,-4 L14,10 Z"/>
      <rect x="-4" y="0" width="8" height="10"/>
    </g>
    <!-- meeple (tabletop) -->
    <g transform="translate(188,22) rotate(6)">
      <circle cx="0" cy="-8" r="3.2" fill="#3a423c" stroke="none"/>
      <path d="M-7,10 L-4,-3 L-1,0 L1,0 L4,-3 L7,10 L4,10 L2,2 L2,10 L-2,10 L-2,2 L-4,10 Z" fill="#3a423c" stroke="none"/>
    </g>
    <!-- dice (tabletop) -->
    <g transform="translate(28,102) rotate(-8)">
      <rect x="-9" y="-9" width="18" height="18" rx="3"/>
      <circle cx="-4" cy="-4" r="1.3" fill="#3a423c" stroke="none"/>
      <circle cx="4" cy="-4" r="1.3" fill="#3a423c" stroke="none"/>
      <circle cx="0" cy="0" r="1.3" fill="#3a423c" stroke="none"/>
      <circle cx="-4" cy="4" r="1.3" fill="#3a423c" stroke="none"/>
      <circle cx="4" cy="4" r="1.3" fill="#3a423c" stroke="none"/>
    </g>
    <!-- book (books) -->
    <g transform="translate(92,112)">
      <path d="M0,-8 L-13,-5 L-13,9 L0,6 L13,9 L13,-5 Z"/>
      <line x1="0" y1="-8" x2="0" y2="6"/>
    </g>
    <!-- tv (telly) -->
    <g transform="translate(152,98) rotate(3)">
      <rect x="-12" y="-8" width="24" height="16" rx="2"/>
      <line x1="-3" y1="-8" x2="-8" y2="-14"/>
      <line x1="3" y1="-8" x2="8" y2="-14"/>
    </g>
    <!-- ticket (movies) -->
    <g transform="translate(200,88) rotate(-8)">
      <rect x="-12" y="-6" width="24" height="12" rx="2"/>
      <line x1="-2" y1="-6" x2="-2" y2="6" stroke-dasharray="1.6,1.6"/>
    </g>
  </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="320" height="190" viewBox="0 0 320 190">
  <!-- Wallpaper of the site's own genres, hand-drawn in the same line-art
       style as the card icons in assets/js/site.js (drawIcon). Dark grey
       on the masthead's near-black background, tiled via CSS
       background-repeat - texture, not artwork. Every shape here is
       original geometry, not a reproduction of any specific game's
       character or asset (no Pac-Man ghost proportions, no actual
       Space Invaders sprite, no real book titles) - generic genre
       icons only, same principle as the site's own image-sourcing
       policy applied to decoration instead of photos. -->
  <g fill="none" stroke="#3a423c" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round">

    <!-- row 1 -->
    <!-- controller (games) -->
    <g transform="translate(24,24)">
      <rect x="-14" y="-6" width="28" height="14" rx="6"/>
      <circle cx="8" cy="-2" r="1.6" fill="#3a423c" stroke="none"/>
      <circle cx="11" cy="2" r="1.6" fill="#3a423c" stroke="none"/>
      <line x1="-9" y1="-3" x2="-9" y2="3"/>
      <line x1="-12" y1="0" x2="-6" y2="0"/>
    </g>
    <!-- mushroom (games) -->
    <g transform="translate(76,16) rotate(-4)">
      <path d="M-10,2 A10,8 0 0 1 10,2 Z" fill="#3a423c" stroke="none"/>
      <rect x="-4" y="2" width="8" height="9" rx="2"/>
      <circle cx="-4" cy="-2" r="1.2" fill="#1c231f" stroke="none"/>
      <circle cx="3" cy="-4" r="1" fill="#1c231f" stroke="none"/>
      <circle cx="1" cy="0" r="0.9" fill="#1c231f" stroke="none"/>
    </g>
    <!-- castle (tabletop) -->
    <g transform="translate(130,28)">
      <path d="M-14,10 L-14,-4 L-10,-4 L-10,-8 L-6,-8 L-6,-4 L-2,-4 L-2,-8 L2,-8 L2,-4 L6,-4 L6,-8 L10,-8 L10,-4 L14,-4 L14,10 Z"/>
      <rect x="-4" y="0" width="8" height="10"/>
    </g>
    <!-- meeple (tabletop) -->
    <g transform="translate(182,18) rotate(6)">
      <circle cx="0" cy="-8" r="3.2" fill="#3a423c" stroke="none"/>
      <path d="M-7,10 L-4,-3 L-1,0 L1,0 L4,-3 L7,10 L4,10 L2,2 L2,10 L-2,10 L-2,2 L-4,10 Z" fill="#3a423c" stroke="none"/>
    </g>
    <!-- handheld console (games) -->
    <g transform="translate(232,22) rotate(-3)">
      <rect x="-7" y="-14" width="14" height="26" rx="2.5"/>
      <rect x="-4.5" y="-11" width="9" height="7" rx="0.5"/>
      <circle cx="-2" cy="3" r="1.2" fill="#3a423c" stroke="none"/>
      <circle cx="2.4" cy="5" r="1.2" fill="#3a423c" stroke="none"/>
      <circle cx="-3.5" cy="7" r="0.9" fill="#3a423c" stroke="none"/>
    </g>
    <!-- treasure chest (tabletop) -->
    <g transform="translate(284,26)">
      <rect x="-12" y="0" width="24" height="10" rx="1.5"/>
      <path d="M-12,0 Q-12,-9 0,-9 Q12,-9 12,0 Z"/>
      <rect x="-2.5" y="-2" width="5" height="5" rx="1"/>
    </g>

    <!-- row 2 -->
    <!-- skull (books/fantasy) -->
    <g transform="translate(24,92) rotate(5)">
      <path d="M-8,-2 Q-8,-11 0,-11 Q8,-11 8,-2 Q8,3 5,4 L5,7 L-5,7 L-5,4 Q-8,3 -8,-2 Z"/>
      <circle cx="-3.5" cy="-2" r="2" fill="#1c231f" stroke="none"/>
      <circle cx="3.5" cy="-2" r="2" fill="#1c231f" stroke="none"/>
      <path d="M-1.3,1.5 L0,4 L1.3,1.5 Z" fill="#1c231f" stroke="none"/>
    </g>
    <!-- d20 (tabletop) -->
    <g transform="translate(78,88)">
      <polygon points="0,-11 9,-5 9,5 0,11 -9,5 -9,-5"/>
      <line x1="0" y1="-11" x2="0" y2="11"/>
      <line x1="-9" y1="-5" x2="9" y2="5"/>
      <line x1="9" y1="-5" x2="-9" y2="5"/>
    </g>
    <!-- sword (games/books) -->
    <g transform="translate(124,90) rotate(-28)">
      <line x1="0" y1="-14" x2="0" y2="6"/>
      <path d="M-2,-14 L2,-14 L0,-18 Z" fill="#3a423c" stroke="none"/>
      <line x1="-5" y1="5" x2="5" y2="5"/>
      <line x1="0" y1="5" x2="0" y2="11"/>
      <circle cx="0" cy="12" r="1.4" fill="#3a423c" stroke="none"/>
    </g>
    <!-- mug (cosy) -->
    <g transform="translate(170,92)">
      <path d="M-7,-6 L-7,8 Q-7,10 -5,10 L5,10 Q7,10 7,8 L7,-6 Z"/>
      <path d="M7,-3 Q13,-3 13,2 Q13,7 7,6"/>
      <line x1="-3" y1="-9" x2="-2" y2="-11"/>
      <line x1="1" y1="-9" x2="2" y2="-11"/>
    </g>
    <!-- ghost (games, generic) -->
    <g transform="translate(216,88)">
      <path d="M-8,8 L-8,-2 Q-8,-11 0,-11 Q8,-11 8,-2 L8,8 L5,5 L2,8 L-2,5 L-5,8 Z"/>
      <circle cx="-3" cy="-3" r="1.3" fill="#1c231f" stroke="none"/>
      <circle cx="3" cy="-3" r="1.3" fill="#1c231f" stroke="none"/>
    </g>
    <!-- pixel alien (games, generic retro arcade trope, not any one sprite) -->
    <g transform="translate(266,90)" shape-rendering="crispEdges">
      <rect x="-6" y="-10" width="12" height="4" fill="#3a423c" stroke="none"/>
      <rect x="-9" y="-6" width="18" height="4" fill="#3a423c" stroke="none"/>
      <rect x="-9" y="-2" width="4" height="4" fill="#1c231f" stroke="none"/>
      <rect x="-3" y="-2" width="6" height="4" fill="#3a423c" stroke="none"/>
      <rect x="5" y="-2" width="4" height="4" fill="#1c231f" stroke="none"/>
      <rect x="-9" y="2" width="6" height="4" fill="#3a423c" stroke="none"/>
      <rect x="-1" y="2" width="2" height="4" fill="#3a423c" stroke="none"/>
      <rect x="3" y="2" width="6" height="4" fill="#3a423c" stroke="none"/>
    </g>

    <!-- row 3 -->
    <!-- dice (tabletop) -->
    <g transform="translate(40,155) rotate(-8)">
      <rect x="-9" y="-9" width="18" height="18" rx="3"/>
      <circle cx="-4" cy="-4" r="1.3" fill="#3a423c" stroke="none"/>
      <circle cx="4" cy="-4" r="1.3" fill="#3a423c" stroke="none"/>
      <circle cx="0" cy="0" r="1.3" fill="#3a423c" stroke="none"/>
      <circle cx="-4" cy="4" r="1.3" fill="#3a423c" stroke="none"/>
      <circle cx="4" cy="4" r="1.3" fill="#3a423c" stroke="none"/>
    </g>
    <!-- book (books) -->
    <g transform="translate(112,158)">
      <path d="M0,-8 L-13,-5 L-13,9 L0,6 L13,9 L13,-5 Z"/>
      <line x1="0" y1="-8" x2="0" y2="6"/>
    </g>
    <!-- tv (telly) -->
    <g transform="translate(182,150) rotate(3)">
      <rect x="-12" y="-8" width="24" height="16" rx="2"/>
      <line x1="-3" y1="-8" x2="-8" y2="-14"/>
      <line x1="3" y1="-8" x2="8" y2="-14"/>
    </g>
    <!-- ticket (movies) -->
    <g transform="translate(252,152) rotate(-8)">
      <rect x="-12" y="-6" width="24" height="12" rx="2"/>
      <line x1="-2" y1="-6" x2="-2" y2="6" stroke-dasharray="1.6,1.6"/>
    </g>
  </g>
</svg>
